name: SCJC tests

on:
  push:
    branches:
      - v2.5-cleanup
      - v2.6-pagination
      - v2.7-catalog-only
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test
