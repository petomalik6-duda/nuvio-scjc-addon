services:
  - type: web
    name: nuvio-scjc-addon
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CDER_MANIFEST_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: nuvio-scjc-cache
          type: keyvalue
          property: connectionString
      - key: CDER_MAX_CONCURRENCY
        value: "1"
      - key: CDER_BACKOFF_MS
        value: "3600000"
      - key: CDER_MIN_INTERVAL_MS
        value: "2000"
      - key: CDER_BUDGET_MAX
        value: "8"
      - key: CDER_BUDGET_WINDOW_MS
        value: "900000"
      - key: CDER_TIMEOUT_MS
        value: "10000"
      - key: CACHE_MAX_ENTRIES
        value: "2000"
      - key: ID_MAP_MAX_ENTRIES
        value: "5000"
