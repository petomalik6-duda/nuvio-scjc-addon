services:
  - type: web
    name: nuvio-scjc-addon
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CDER_MANIFEST_URL
        sync: false
      - key: CDER_MAX_CONCURRENCY
        value: "3"
      - key: CDER_BACKOFF_MS
        value: "300000"
      - key: CDER_TIMEOUT_MS
        value: "10000"
      - key: CACHE_MAX_ENTRIES
        value: "2000"
      - key: ID_MAP_MAX_ENTRIES
        value: "5000"
